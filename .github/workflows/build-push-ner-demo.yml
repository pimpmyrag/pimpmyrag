name: Build & Push ner-demo image

on:
  push:
    branches: [main]
    paths:
      - 'ner-demo/**'
      - 'connectors/**'
      - 'scripts/render/**'
      - 'training/multi-head/tokenizer_export_clean/**'
      - '.github/workflows/build-push-ner-demo.yml'
  workflow_dispatch:

jobs:
  build-push:
    name: Build Docker image & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pimpmyrag/ner-demo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ner-demo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump CACHE_BUST in Dockerfile.render to force Render pull
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/^ARG CACHE_BUST=.*/ARG CACHE_BUST=${SHORT_SHA}/" ner-demo/Dockerfile.render
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ner-demo/Dockerfile.render
          git diff --cached --quiet || git commit -m "ci: bump CACHE_BUST to ${SHORT_SHA} [skip ci]"
          git push origin HEAD:main

