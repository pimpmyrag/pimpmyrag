name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JVM 21)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false        # modèles ONNX non nécessaires pour compiler/tester
          fetch-depth: 0

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build all modules
        run: ./gradlew build -x test --no-daemon --parallel --stacktrace
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run tests
        run: ./gradlew test --no-daemon --continue --stacktrace
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      # ── Rapport de test ─────────────────────────────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk21
          path: '**/build/reports/tests/'
          retention-days: 7
