name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          lfs: false   # données d'entraînement gérées hors git

      # ── JDK ─────────────────────────────────────────────────────────────────
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── Build + tests unitaires ─────────────────────────────────────────────
      # Les tests @Tag("integration") + @EnabledIfSystemProperty(ner.integration.enabled)
      # sont ignorés par défaut : les modèles ONNX ne sont pas disponibles en CI.
      # Pour les activer localement : -Dner.integration.enabled=true
      - name: Build & unit tests
        run: |
          ./gradlew test --continue \
            -Dner.test.report=${{ github.workspace }}/build/ner-report.md
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── Résumé JUnit → Job Summary ───────────────────────────────────────────
      # Parsing natif des XML JUnit via Python (pas de token GitHub requis).
      - name: JUnit summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os, sys

          files = glob.glob('**/build/test-results/test/*.xml', recursive=True)
          total = failed = errors = skipped = 0
          fail_details = []

          for f in files:
              try:
                  root = ET.parse(f).getroot()
                  total   += int(root.get('tests',    0))
                  failed  += int(root.get('failures', 0))
                  errors  += int(root.get('errors',   0))
                  skipped += int(root.get('skipped',  0))
                  for tc in root.findall('.//testcase'):
                      for bad in tc.findall('failure') + tc.findall('error'):
                          name = f"{tc.get('classname','?')}.{tc.get('name','?')}"
                          msg  = (bad.text or '').strip()[:200]
                          fail_details.append(f'- `{name}`: {msg}')
              except Exception as e:
                  print(f'Warning: cannot parse {f}: {e}', file=sys.stderr)

          if total == 0 and not files:
              print('No JUnit XML files found — skipping summary.')
              sys.exit(0)

          passed = total - failed - errors - skipped
          icon   = '✅' if (failed + errors) == 0 else '❌'

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if summary_path:
              with open(summary_path, 'a') as out:
                  out.write(f'### {icon} JUnit Tests — {passed}/{total} passed')
                  out.write(f' ({skipped} skipped, {failed + errors} failed)\n\n')
                  if fail_details:
                      out.write('**Échecs :**\n')
                      out.write('\n'.join(fail_details[:30]) + '\n\n')

          print(f'Tests: {passed}/{total} passed | {failed+errors} failed | {skipped} skipped')
          EOF

      # ── Rapport NER → Job Summary ────────────────────────────────────────────
      - name: NER report to Job Summary
        if: always()
        run: |
          REPORT="${{ github.workspace }}/build/ner-report.md"
          echo "### NER Integration Test" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⏭️ Test d'intégration ignoré — modèles ONNX non disponibles en CI." >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> Lancez localement avec :" >> $GITHUB_STEP_SUMMARY
            echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "> ./gradlew :radar-nli-toolkit:test -Dner.integration.enabled=true" >> $GITHUB_STEP_SUMMARY
            echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      # ── Artifact : rapport NER (uniquement s'il existe) ──────────────────────
      - name: Upload NER report artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('build/ner-report.md') != ''
        with:
          name: ner-test-report
          path: build/ner-report.md
          retention-days: 30

      # ── Artifact : résultats JUnit XML bruts ─────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14
