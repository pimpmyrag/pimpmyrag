name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          lfs: false   # données d'entraînement gérées hors git

      # ── JDK ─────────────────────────────────────────────────────────────────
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── Build + tests unitaires ─────────────────────────────────────────────
      # Les tests @Tag("integration") + @EnabledIfSystemProperty(ner.integration.enabled)
      # sont ignorés par défaut : les modèles ONNX ne sont pas disponibles en CI.
      # Pour les activer localement : -Dner.integration.enabled=true
      - name: Build & unit tests
        run: |
          ./gradlew test --continue \
            -Dner.test.report=${{ github.workspace }}/build/ner-report.md
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── Rapport JUnit (annotations PR + onglet Tests) ───────────────────────
      - name: Publish JUnit results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'JUnit Tests'
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false   # ne pas casser le build si zéro test trouvé

      # ── Rapport NER → Job Summary ────────────────────────────────────────────
      # Le fichier n'existe que si le serveur était disponible pendant les tests.
      # Sur CI standard il sera absent (test skippé) → message informatif affiché.
      - name: NER report to Job Summary
        if: always()
        run: |
          REPORT="${{ github.workspace }}/build/ner-report.md"
          echo "### NER Integration Test" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⏭️ Test d'intégration ignoré — serveur NER non disponible en CI." >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> Lancez localement :" >> $GITHUB_STEP_SUMMARY
            echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "> ./gradlew :radar-nli-toolkit:test -Dner.test.url=http://localhost:8080" >> $GITHUB_STEP_SUMMARY
            echo "> \`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      # ── Artifact : rapport NER (téléchargeable depuis l'onglet Summary) ──────
      - name: Upload NER report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ner-test-report
          path: build/ner-report.md
          if-no-files-found: ignore
          retention-days: 30

      # ── Artifact : résultats JUnit XML bruts ─────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14
