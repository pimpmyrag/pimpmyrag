name: Export ONNX model on Linux

on:
  workflow_dispatch:
    inputs:
      pt_release_tag:
        description: "Release tag containing best_model_multitask.pt (ex: v1.1.0-ner-model)"
        required: true
        default: "v1.3.0-ner-model"
      pt_sha256:
        description: "Expected SHA-256 of best_model_multitask.pt (optionnel — vide = pas de vérification)"
        required: false
        default: "b62eec5cd7d7002b1b836e2be020ed4ad7ebfc96c74e55665afed00ada3f7883"
      output_tag:
        description: "Tag de la release de sortie (ex: v1.2.0-ner-model)"
        required: true
        default: "v1.3.0-ner-model"
      opset:
        description: "ONNX opset version"
        required: false
        default: "17"
      quantize:
        description: "Produire aussi le modèle quantifié INT8"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Dépendances CPU-only (pas besoin de CUDA pour l'export) ────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Torch CPU-only d'abord (index séparé)
          pip install "torch>=2.6.0" --index-url https://download.pytorch.org/whl/cpu
          # Reste des dépendances depuis PyPI
          pip install \
            "transformers>=4.40.0" \
            "tokenizers>=0.19.0" \
            "sentencepiece>=0.2.0" \
            "onnx>=1.16.0" \
            "onnxruntime>=1.18.0" \
            "numpy>=1.24.0"

      # ── Téléchargement du checkpoint .pt depuis la release GitHub ──────────
      - name: Download PT checkpoint from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PT_TAG: ${{ inputs.pt_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/model
          echo "Téléchargement de best_model_multitask.pt depuis la release $PT_TAG"
          gh release download "$PT_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "best_model_multitask.pt" \
            --dir /tmp/model
          ls -lh /tmp/model/

      # ── Vérification checksum (si fournie) ────────────────────────────────
      - name: Verify PT checksum
        if: ${{ inputs.pt_sha256 != '' }}
        run: |
          ACTUAL=$(sha256sum /tmp/model/best_model_multitask.pt | awk '{print $1}')
          EXPECTED="${{ inputs.pt_sha256 }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SHA-256 mismatch: got $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "✅ SHA-256 OK: $ACTUAL"

      # ── Export ONNX FP32 ───────────────────────────────────────────────────
      - name: Export ONNX on Linux CPU
        run: |
          set -euo pipefail
          mkdir -p /tmp/onnx
          cd training/multi-head
          python export_vec_full.py \
            --checkpoint /tmp/model/best_model_multitask.pt \
            --output /tmp/onnx/best_model_multitask_full.onnx \
            --model-name microsoft/deberta-v3-base \
            --tokenizer-path ../../deberta/tokenizer_export \
            --opset ${{ inputs.opset }} \
            --seq-len 128 \
            --num-spans 64
          ls -lh /tmp/onnx/

      # ── Quantification INT8 ───────────────────────────────────────────────
      - name: Quantize ONNX to INT8
        if: ${{ inputs.quantize }}
        run: |
          set -euo pipefail
          cd training/multi-head
          python quantize_onnx.py \
            --input  /tmp/onnx/best_model_multitask_full.onnx \
            --output /tmp/onnx/best_model_multitask_full_q8.onnx
          ls -lh /tmp/onnx/

      # ── Compute SHA-256 ────────────────────────────────────────────────────
      - name: Compute output SHA-256
        id: sha
        run: |
          set -euo pipefail
          SHA_FP32=$(sha256sum /tmp/onnx/best_model_multitask_full.onnx | awk '{print $1}')
          echo "onnx_sha256=$SHA_FP32" >> "$GITHUB_OUTPUT"
          echo "✅ ONNX FP32 SHA-256: $SHA_FP32"

          if [ -f /tmp/onnx/best_model_multitask_full_q8.onnx ]; then
            SHA_Q8=$(sha256sum /tmp/onnx/best_model_multitask_full_q8.onnx | awk '{print $1}')
            echo "onnx_q8_sha256=$SHA_Q8" >> "$GITHUB_OUTPUT"
            echo "✅ ONNX INT8 SHA-256: $SHA_Q8"
          fi

          echo ""
          echo "=== À mettre dans Dockerfile ==="
          echo "NER_MODEL_SHA256=$SHA_FP32"

      # ── Publication release GitHub ─────────────────────────────────────────
      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_TAG: ${{ inputs.output_tag }}
        run: |
          set -euo pipefail
          cd /tmp/onnx

          # Checksum file — tous les .onnx présents
          sha256sum *.onnx > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # Créer la release si elle n'existe pas
          NOTES="Modele exporte sur Linux (ubuntu-latest).
          FP32 SHA-256 : ${{ steps.sha.outputs.onnx_sha256 }}"
          if [ -n "${{ steps.sha.outputs.onnx_q8_sha256 }}" ]; then
            NOTES="${NOTES}
          INT8 SHA-256 : ${{ steps.sha.outputs.onnx_q8_sha256 }}"
          fi

          if ! gh release view "$OUT_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$OUT_TAG" \
              --repo "${{ github.repository }}" \
              --title "NER multitask ONNX model linux-export $OUT_TAG" \
              --notes "$NOTES"
          fi

          # Upload tous les .onnx + checksums
          UPLOAD_FILES="best_model_multitask_full.onnx SHA256SUMS.txt"
          if [ -f best_model_multitask_full_q8.onnx ]; then
            UPLOAD_FILES="$UPLOAD_FILES best_model_multitask_full_q8.onnx"
          fi
          # shellcheck disable=SC2086
          gh release upload "$OUT_TAG" \
            --repo "${{ github.repository }}" \
            $UPLOAD_FILES \
            --clobber

      # ── Mise à jour automatique du Dockerfile → déclenche le rebuild ──────
      - name: Update Dockerfile ARGs and trigger image rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_TAG: ${{ inputs.output_tag }}
          NEW_SHA: ${{ steps.sha.outputs.onnx_sha256 }}
        run: |
          set -euo pipefail
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/${OUT_TAG}/best_model_multitask_full.onnx"

          echo "Mise à jour de ner-demo/Dockerfile :"
          echo "  MODEL_URL  = $NEW_URL"
          echo "  MODEL_SHA256 = $NEW_SHA"

          # Remplace les lignes ARG MODEL_URL et ARG MODEL_SHA256
          sed -i "s|ARG MODEL_URL=.*|ARG MODEL_URL=${NEW_URL}|" ner-demo/Dockerfile
          sed -i "s|ARG MODEL_SHA256=.*|ARG MODEL_SHA256=${NEW_SHA}|" ner-demo/Dockerfile

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ner-demo/Dockerfile
          git diff --cached --quiet && echo "Aucun changement détecté" && exit 0
          git commit -m "ci: use linux-exported ONNX ${OUT_TAG} (sha256=${NEW_SHA::12}…)"
          git push origin HEAD:main
          echo "✅ Dockerfile mis à jour — build-push-ner-demo.yml va se déclencher automatiquement"

      - name: Summary
        run: |
          echo "## Export ONNX terminé " >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fichier | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| FP32 (\`best_model_multitask_full.onnx\`) | \`${{ steps.sha.outputs.onnx_sha256 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.sha.outputs.onnx_q8_sha256 }}" ]; then
            echo "| INT8 (\`best_model_multitask_full_q8.onnx\`) | \`${{ steps.sha.outputs.onnx_q8_sha256 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Paramètre | Valeur |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release output | \`${{ inputs.output_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quantization | ${{ inputs.quantize }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dockerfile mis à jour | ✅ build-push-ner-demo.yml déclenché |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ARGs dans ner-demo/Dockerfile" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ARG MODEL_URL=https://github.com/${{ github.repository }}/releases/download/${{ inputs.output_tag }}/best_model_multitask_full.onnx" >> "$GITHUB_STEP_SUMMARY"
          echo "ARG MODEL_SHA256=${{ steps.sha.outputs.onnx_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.sha.outputs.onnx_q8_sha256 }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Modèle INT8 (quantifié)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.output_tag }}/best_model_multitask_full_q8.onnx" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA256: ${{ steps.sha.outputs.onnx_q8_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

