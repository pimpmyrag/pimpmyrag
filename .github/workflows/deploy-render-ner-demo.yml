name: Deploy ner-demo to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Validate deploy hook secret
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi

      - name: Trigger deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered"

  smoke-check:
    name: Smoke check deployed service
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.RENDER_NER_DEMO_URL != '' }}
    steps:
      - name: Poll public URL
        env:
          RENDER_NER_DEMO_URL: ${{ vars.RENDER_NER_DEMO_URL }}
        run: |
          set -e
          BASE_URL="${RENDER_NER_DEMO_URL%/}"
          TARGET="$BASE_URL/"
          echo "Polling $TARGET"
          for i in $(seq 1 60); do
            if curl -fsS "$TARGET" >/dev/null; then
              echo "Smoke check OK"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke check failed after 10 minutes" >&2
          exit 1

