infinity:
  embedding:
    base-url: "https://api.runpod.ai/v2/9vafmopz4lhiak/runsync"   # Ajout de /embeddings
    api-key: "${RUNPOD_API_KEY}"
    model-name: "intfloat/multilingual-e5-large"
    batch-size: 32
    concurrency: 1  # Réduit pour éviter surcharge

ud:
  client:
    host: localhost
    port: 8000
onnx:
  ner:
    label:

      # RoBERTa XLM-R BIO — 13 labels coarses (F1=0.8537) — INT8 (75% plus petit, 2.79× plus rapide)
      modelPath: "/Users/simon_longuet/IdeaProjects/pimpmyrag/training/training_package/training_output/model_v5.onnx"
      tokenizerDir: "/Users/simon_longuet/IdeaProjects/pimpmyrag/training/training_package/training_output/checkpoint-7800"
      maxLen: 128
      maxSeqLen: 128
      useGpu: false
      useCoreMl: false
      intraOpThreads: 4
    ud:
      # DeBERTa-v3 SpanClassifier — 22 hints fins (Macro F1=0.883) — INT8 valide (218MB)
      # v4 (Apr 6) > v3 (Apr 2, F1=0.875) — coarse_ids inclus
      modelPath: "/Users/simon_longuet/IdeaProjects/pimpmyrag/training/training_package/training_output_deberta/best_model_v6.onnx"
      tokenizerDir: "/Users/simon_longuet/IdeaProjects/pimpmyrag/deberta/tokenizer_export"
      maxLen: 128
      useGpu: false
      useCoreMl: false
      intraOpThreads: 4
      sentBatchSize: 32


  embedding:
    # Chemin vers le modèle bge-m3 quantifié pour Mac (ARM64)
    modelPath: "/Users/simon_longuet/IdeaProjects/pimpmyrag/docker-resources/onnx_converter_bundle/models/bge-m3-mac/model_quantized.onnx"
    # Répertoire contenant le tokenizer pour bge-m3
    tokenizerDir: "/Users/simon_longuet/IdeaProjects/pimpmyrag/docker-resources/onnx_converter_bundle/models/bge-m3-mac/"
    # bge-m3 nécessite une normalisation L2 pour des scores de similarité corrects
    l2Normalize: true
    # Longueur de séquence maximale, 512 est une valeur standard pour bge-m3
    maxLen: 64
    # Désactiver le GPU car le modèle est optimisé pour le CPU ARM64
    useGpu: false
    # Nombre de threads à utiliser pour les opérations internes du modèle
    intraOpThreads: 4 # Ou Runtime.getRuntime().availableProcessors()

logging:
  level:
    org.springframework.web: DEBUG
    rag.connectors.ud.stanza.OnnxSpanNerExtractor: DEBUG
    rag.connectors.ner.onnx.OnnxBilouEntityExtractor: DEBUG
    io.axes.classifier.ClassifierController: DEBUG
    io.netty: DEBUG
