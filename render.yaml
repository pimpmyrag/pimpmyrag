services:
  - type: web
    name: ner-demo
    runtime: docker
    dockerfilePath: ./ner-demo/Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    port: 10000
    plan: standard
    envVars:
      - key: JAVA_TOOL_OPTIONS
        # Heap réduit à 1g : le modèle ONNX (708MB) est en mémoire native (off-heap).
        # Budget mémoire Standard (2GB) : 1GB heap + 708MB ONNX + ~200MB OS/JVM ≈ 1.9GB
        value: -Xms128m -Xmx1g
      - key: NER_TAU_SVO_BOUNDARY
        # Sur Linux CPU (ONNX Runtime), la tête svo_boundary fire à ~0.65-0.97 sur les NPs
        # (artefact plateforme vs macOS ARM/CoreML). Seuil relevé pour filtrer les faux verbes.
        # Vrais verbes : p_bnd=0.994-1.000. Faux positifs : p_bnd=0.517-0.752.
        value: "0.95"
