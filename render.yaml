services:
  - type: web
    name: ner-demo
    runtime: docker
    dockerfilePath: ./ner-demo/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -Xms512m -Xmx2g
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        sync: false
      - key: TOKENIZER_URL
        sync: false
      - key: TOKENIZER_SHA256
        sync: false
      - key: NER_MODEL_PATH
        sync: false
      - key: NER_TOKENIZER_PATH
        sync: false

