server.port=${PORT:8090}
spring.application.name=ner-demo

# Chemins modèle + tokenizer
ner.model-path=${NER_MODEL_PATH:models/deberta/fine-tunning-23042026/best_model_multitask_full.onnx}
ner.tokenizer-path=${NER_TOKENIZER_PATH:training/multi-head/tokenizer_export_clean}

# Paramètres extracteur
ner.max-seq-len=128
ner.max-span-len=12
ner.tau-boundary=0.70
ner.tau-none=0.99
ner.tau-coarse=0.45
ner.tau-svo-boundary=0.50

# Batch streaming : nombre de phrases par appel ONNX
# Valeur basse (2) pour la démo : réduit les pics mémoire des tenseurs ONNX natifs
# (batchSize × maxSeqLen × hidden_size alloués par forward pass)
ner.batch-size=2

# ── Optimisations mémoire ORT (importantes sur Render 2 GB) ──────────────────
# BASIC_OPT : constant folding + shape inference uniquement.
#   Pic mémoire au chargement ~1× modèle (vs ~2× pour ALL_OPT).
#   Pour la démo la différence de latence est négligeable à batch=2.
ner.opt-level=BASIC_OPT
# CPU Arena désactivée : la RAM est restituée à l'OS après chaque inférence.
#   (true = pool permanent → meilleures perfs, mais RAM retenue entre les requêtes)
ner.cpu-arena=false
# 1 thread intra-op : évite le pool de threads ORT (buffers par thread).
#   Sur 2 vCPU Render, 2 threads n'apportent pas de gain significatif for batch=2.
ner.intra-op-threads=1

# Désactiver la sécurité Vaadin (mode démo)
vaadin.launch-browser=false

# Push WebSocket pour le streaming des résultats
vaadin.push-mode=AUTOMATIC

# ── Suppression des logs parasites WebSocket (Connection remotely closed = bénin) ──
logging.level.org.atmosphere=WARN
logging.level.com.vaadin.flow.server.communication.PushAtmosphereHandler=WARN

# ── MCP Server (Spring AI) ────────────────────────────────────────────────────
# Transport SSE — le serveur MCP écoute sur /mcp/sse (même port que l'app)
# Connexion depuis un client MCP : http://localhost:8090/mcp/sse
spring.ai.mcp.server.name=ner-demo
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages

# Description affichée au client MCP
spring.ai.mcp.server.instructions=\
  NER+SVO DeBERTa demo server. \
  Tools: getConfig (thresholds + runtime device/thread info), \
  analyzeText (inference + scores + inferenceMs), \
  setThreshold (global tau), \
  setCoarseScore (per-family score floor), \
  scanThreshold (sweep a range on a reference text), \
  analyzeBatch (corpus stats + totalMs/msPerSentence), \
  applyAndAnalyze (commit best-guess config + re-run in one call), \
  probePerformance (benchmark: cold/warm latency, batch throughput, entities/s). \
  Nested NMS: sub-spans kept only when fine label differs from parent.


