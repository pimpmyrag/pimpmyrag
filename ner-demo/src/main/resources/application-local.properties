# ── Overrides pour exécution locale (Apple Silicon / machine de dev) ──────────
# Activer avec : --spring.profiles.active=local
# ou variable d'environnement : SPRING_PROFILES_ACTIVE=local

# Batch size plus grand : la RAM locale n'est pas limitée à 2 GB
ner.batch-size=8

# ALL_OPT : constant folding + toutes les optimisations graph ORT
ner.opt-level=ALL_OPT

# CPU Arena : pool de mémoire permanent — meilleures perfs, ~+200 MB RAM retenue
ner.cpu-arena=true

# 0 = auto-detect : utilise tous les cores disponibles (Apple M1/M2/M3)
ner.intra-op-threads=0

