# ── Profil Render ─────────────────────────────────────────────────────────────
# Vaadin tourne en dev-mode (le plugin Gradle est incompatible avec Gradle 9).
# Node.js 20 est installé dans l'image Docker pour permettre la compilation frontend.

# Désactiver le live-reload (inutile en prod, évite les erreurs WebSocket de dev)
vaadin.devmode.liveReload.enabled=false

# Répertoire writable pour le cache npm/Vite de Vaadin (par défaut ~/.vaadin)
vaadin.devmode.npmFolder=/tmp/vaadin-npm

# Logging Atmosphere déjà à WARN dans application.properties

